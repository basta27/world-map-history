  let s='';
  for(let i=0;i<5;i++) s+=i<n?'<span class="stars">★</span>':'<span class="star-empty">★</span>';
  return s;
}

// Helper: find the right era for a country at a given year

  return country.eras.find(e=>year>=e.from&&year<=e.to);
}

// ======= MAP SETUP =======
const map = L.map('map',{center:[25,15],zoom:2,minZoom:2,maxZoom:6,zoomControl:true});
L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_nolabels/{z}/{y}/{x}.png',{
  attribution:'© CartoDB',subdomains:'abcd',opacity:0.3
}).addTo(map);

let bgLayer = L.layerGroup().addTo(map);
let empireLayer = L.layerGroup().addTo(map);
let labelLayer = L.layerGroup().addTo(map);
let capitalLayer = L.layerGroup().addTo(map);
let eventLayer = L.layerGroup().addTo(map);

// Load country outlines
fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
  .then(r=>r.json()).then(geo=>{
    L.geoJSON(geo,{style:{color:'#3a2a15',weight:0.6,fillColor:'#ece0c8',fillOpacity:1},interactive:false}).addTo(bgLayer);
    renderYear(currentYear);
  }).catch(()=>{});

const slider=document.getElementById('yr-slider');
const yrDisp=document.getElementById('yr-display');
const playBtn=document.getElementById('play-btn');
const tlEvents=document.getElementById('tl-events');
const infoPanel=document.getElementById('info');
const searchInput=document.getElementById('search-input');
const searchResults=document.getElementById('search-results');

let currentYear=2025, playing=false, playInt=null;

function showInfo(era){
  document.getElementById('info-name').textContent=era.name;
  document.getElementById('info-period').textContent=`${era.from}–${era.to>=2025?'heute':era.to}`;
  document.getElementById('info-desc').textContent=era.desc;
  let meta='';
  if(era.capName) meta+=`<div class="meta-row"><span class="meta-label">Hauptstadt</span>${era.capName}</div>`;
  if(era.ruler) meta+=`<div class="meta-row"><span class="meta-label">Herrscher</span>${era.ruler}</div>`;
  if(era.religion) meta+=`<div class="meta-row"><span class="meta-label">Religion</span>${era.religion}</div>`;
  if(era.pop) meta+=`<div class="meta-row"><span class="meta-label">Bevölkerung</span>${era.pop}</div>`;
  if(era.lang) meta+=`<div class="meta-row"><span class="meta-label">Sprache</span>${era.lang}</div>`;
  document.getElementById('info-meta').innerHTML=meta;
  let rat='';
  if(era.ratings){
    const labels={wirtschaft:'🏭 Wirtschaft',militaer:'⚔️ Militär',kultur:'📚 Kultur',einfluss:'🌍 Einfluss',innovation:'💡 Innovation'};
    for(let k in labels){
      rat+=`<div class="rating-row"><span class="rating-label">${labels[k]}</span>${starsHTML(era.ratings[k])}</div>`;
    }
  }
  document.getElementById('info-ratings').innerHTML=rat;
  infoPanel.style.display='block';
}

function showEventInfo(ev){
  document.getElementById('info-name').textContent=ev.name;
  document.getElementById('info-period').textContent=`Jahr ${ev.year}`;
  document.getElementById('info-desc').textContent=ev.desc;
  document.getElementById('info-meta').innerHTML='';
  document.getElementById('info-ratings').innerHTML='';
  infoPanel.style.display='block';
}

function renderYear(year){
  currentYear=year;
  yrDisp.textContent=year;
  slider.value=year;
  empireLayer.clearLayers();
  labelLayer.clearLayers();
  capitalLayer.clearLayers();
  eventLayer.clearLayers();

  COUNTRIES.forEach(c=>{
    const era=getEra(c,year);
    if(!era) return;
    const poly=L.polygon(c.poly,{color:'#1a1208',weight:1.2,fillColor:era.ratings?
      (era.ratings.einfluss>=4?'#c0392b':era.ratings.wirtschaft>=4?'#2980b9':'#8a7050'):'#8a7050',
      fillOpacity:0.45}).addTo(empireLayer);
    poly.on('click',()=>showInfo(era));
    poly.bindTooltip(era.name,{direction:'center',className:'empire-tooltip'});

    // Label
    let cx=0,cy=0;
    c.poly.forEach(p=>{cx+=p[0];cy+=p[1]});
    cx/=c.poly.length;cy/=c.poly.length;
    const sz=c.poly.length>15?11:c.poly.length>10?10:9;
    const lbl=L.divIcon({className:'',html:`<div class="empire-label" style="font-size:${sz}px">${era.name}</div>`,iconSize:[130,18],iconAnchor:[65,9]});
    L.marker([cx,cy],{icon:lbl,interactive:false}).addTo(labelLayer);

    // Capital
    if(era.cap){
      const m=L.marker(era.cap,{icon:L.divIcon({className:'capital-marker',iconSize:[7,7]})}).addTo(capitalLayer);
      m.bindTooltip(`★ ${era.capName}`,{direction:'top'});
      m.on('click',()=>showInfo(era));
    }
  });

  // Events
  EVENTS.filter(ev=>Math.abs(ev.year-year)<=5).forEach(ev=>{
    const m=L.marker([ev.lat,ev.lng],{icon:L.divIcon({className:'event-marker',iconSize:[10,10]})}).addTo(eventLayer);
    m.bindTooltip(`⚡ ${ev.year}: ${ev.name}`,{direction:'top'});
    m.on('click',()=>showEventInfo(ev));
  });

  // Timeline events
  const upcoming=EVENTS.filter(ev=>ev.year>=year&&ev.year<=year+25).slice(0,5);
  tlEvents.innerHTML=upcoming.map(ev=>`<span class="tl-ev" data-year="${ev.year}">${ev.year}: ${ev.name}</span>`).join('');
  tlEvents.querySelectorAll('.tl-ev').forEach(el=>{
    el.addEventListener('click',()=>{const y=parseInt(el.dataset.year);renderYear(y);const ev=EVENTS.find(e=>e.year===y);if(ev){map.setView([ev.lat,ev.lng],4);showEventInfo(ev);}});
  });
}

slider.addEventListener('input',()=>renderYear(parseInt(slider.value)));
playBtn.addEventListener('click',()=>{
  if(playing){clearInterval(playInt);playBtn.textContent='▶';playing=false;}
  else{playing=true;playBtn.textContent='⏸';playInt=setInterval(()=>{let y=parseInt(slider.value)+5;if(y>2025)y=1500;renderYear(y);},800);}
});

// Search
function doSearch(q){
  q=q.toLowerCase().trim();
  if(q.length<2){searchResults.style.display='none';return;}
  let html='';
  COUNTRIES.forEach(c=>{c.eras.forEach(e=>{
    if(e.name.toLowerCase().includes(q)||(e.capName&&e.capName.toLowerCase().includes(q))||(e.ruler&&e.ruler.toLowerCase().includes(q)))
      html+=`<div class="search-item" data-cid="${c.id}" data-from="${e.from}" data-to="${e.to}">${e.name}<span class="yr">${e.from}–${e.to>=2025?'heute':e.to}</span></div>`;
  });});
  EVENTS.forEach(e=>{
    if(e.name.toLowerCase().includes(q))
      html+=`<div class="search-item" data-type="ev" data-year="${e.year}">${e.name}<span class="yr">${e.year}</span></div>`;
  });
  if(!html) html='<div class="search-item">Keine Ergebnisse</div>';
  searchResults.innerHTML=html;
  searchResults.style.display='block';
  searchResults.querySelectorAll('.search-item').forEach(item=>{
    item.addEventListener('click',()=>{
      if(item.dataset.type==='ev'){
        const y=parseInt(item.dataset.year);renderYear(y);
        const ev=EVENTS.find(e=>e.year===y);if(ev){map.setView([ev.lat,ev.lng],5);showEventInfo(ev);}
      } else {
        const c=COUNTRIES.find(x=>x.id===item.dataset.cid);
        const midY=Math.floor((parseInt(item.dataset.from)+Math.min(parseInt(item.dataset.to),2025))/2);
        renderYear(midY);
        if(c){let cx=0,cy=0;c.poly.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=c.poly.length;cy/=c.poly.length;map.setView([cx,cy],4);}
        const era=c?getEra(c,midY):null;if(era)showInfo(era);
      }
      searchResults.style.display='none';searchInput.value='';
    });
  });
}
searchInput.addEventListener('input',()=>doSearch(searchInput.value));
document.addEventListener('click',e=>{if(!e.target.closest('#search-box'))searchResults.style.display='none';});
document.getElementById('info-close').addEventListener('click',()=>infoPanel.style.display='none');

renderYear(2025);
})();
</script>
