  {id:"germany_mod",name:"Deutschland",from:1949,to:2025,color:"#9b8bc4",poly:[[55,6],[54,15],[51,15],[48,10],[51,6]],cap:[52.52,13.4],capName:"Berlin",desc:"Wiedervereinigung 1990. Größte Volkswirtschaft Europas. EU-Lokomotive.",ruler:"Scholz",religion:"Christlich",pop:"~84 Mio.",lang:"Deutsch"},
  {id:"france_mod",name:"Frankreich",from:1815,to:2025,color:"#5870a8",poly:[[51,2],[50,8],[48,8],[44,7],[43,3],[43,-1],[46,-2],[49,-1],[51,2]],cap:[48.86,2.35],capName:"Paris",desc:"Heute Fünfte Republik. EU-Gründungsmitglied. Atommacht.",ruler:"Macron",religion:"Katholisch",pop:"~68 Mio.",lang:"Französisch"},
  {id:"eu",name:"Europäische Union",from:1993,to:2025,color:"#3a5da8",poly:[[60,-9],[60,30],[36,30],[36,-9]],cap:[50.85,4.35],capName:"Brüssel",desc:"Wirtschafts- und Politikbund. 27 Mitglieder. Euro 2002. Größter Binnenmarkt.",ruler:"Von der Leyen",religion:"Säkular",pop:"~448 Mio.",lang:"24 Sprachen"},
  {id:"australia",name:"Australien",from:1901,to:2025,color:"#a85870",poly:[[-12,113],[-15,135],[-18,147],[-30,153],[-38,140],[-32,118],[-23,113]],cap:[-35.28,149.13],capName:"Canberra",desc:"Föderaler Staat. Wohlhabende Demokratie. Commonwealth-Mitglied.",ruler:"Premierminister",religion:"Christlich",pop:"~26 Mio.",lang:"Englisch"},
];

const EVENTS = [
  {year:1492,name:"Kolumbus entdeckt Amerika",lat:23.13,lng:-82.36,desc:"Beginn des Kolonialzeitalters."},
  {year:1517,name:"Reformation",lat:51.86,lng:12.65,desc:"Martin Luther veröffentlicht 95 Thesen. Spaltung der westlichen Christenheit."},
  {year:1588,name:"Spanische Armada besiegt",lat:50.0,lng:-1.0,desc:"England siegt. Wende der Seemacht."},
  {year:1683,name:"Belagerung Wiens",lat:48.21,lng:16.37,desc:"Osmanen werden geschlagen. Beginn ihres Niedergangs."},
  {year:1707,name:"Vereinigung England-Schottland",lat:51.5,lng:-0.13,desc:"Großbritannien entsteht."},
  {year:1776,name:"Amerikanische Unabhängigkeit",lat:39.95,lng:-75.17,desc:"13 Kolonien erklären Unabhängigkeit in Philadelphia."},
  {year:1789,name:"Französische Revolution",lat:48.86,lng:2.35,desc:"Sturm auf die Bastille. Beginn der modernen Demokratie."},
  {year:1804,name:"Napoleon krönt sich",lat:48.85,lng:2.34,desc:"Napoleon wird Kaiser der Franzosen."},
  {year:1815,name:"Schlacht bei Waterloo",lat:50.68,lng:4.4,desc:"Napoleon endgültig besiegt."},
  {year:1861,name:"Italienische Einigung",lat:41.9,lng:12.5,desc:"Königreich Italien gegründet."},
  {year:1865,name:"Ende US-Bürgerkrieg",lat:38.91,lng:-77.04,desc:"Sklaverei abgeschafft. ~620.000 Tote."},
  {year:1871,name:"Deutsche Reichsgründung",lat:48.81,lng:2.13,desc:"Wilhelm I. zum Kaiser proklamiert."},
  {year:1914,name:"1. Weltkrieg",lat:43.86,lng:18.41,desc:"Attentat von Sarajevo. ~17 Mio. Tote."},
  {year:1917,name:"Oktoberrevolution",lat:59.94,lng:30.31,desc:"Bolschewiken stürzen Zarenreich."},
  {year:1939,name:"2. Weltkrieg",lat:52.23,lng:21.01,desc:"Deutschland überfällt Polen. ~70-85 Mio. Tote."},
  {year:1945,name:"Atombombe auf Hiroshima",lat:34.39,lng:132.45,desc:"Erste Atomwaffe im Krieg eingesetzt."},
  {year:1947,name:"Indien unabhängig",lat:28.61,lng:77.21,desc:"Britisch-Indien wird unabhängig. Teilung."},
  {year:1949,name:"Volksrepublik China",lat:39.91,lng:116.4,desc:"Mao proklamiert VR China."},
  {year:1989,name:"Mauerfall",lat:52.52,lng:13.4,desc:"Berliner Mauer fällt."},
  {year:1991,name:"Sowjetunion zerfällt",lat:55.75,lng:37.62,desc:"UdSSR zerfällt in 15 Staaten."},
  {year:1993,name:"EU gegründet",lat:50.85,lng:4.35,desc:"Maastrichter Vertrag. Aus EWG wird EU."},
];

const map = L.map('map', {center:[25,15], zoom:2, minZoom:2, maxZoom:6, zoomControl:true});

L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_nolabels/{z}/{y}/{x}.png', {
  attribution:'© CartoDB',subdomains:'abcd',opacity:0.3
}).addTo(map);

let continentLayer = L.layerGroup().addTo(map);
let empireLayer = L.layerGroup().addTo(map);
let labelLayer = L.layerGroup().addTo(map);
let capitalLayer = L.layerGroup().addTo(map);
let eventLayer = L.layerGroup().addTo(map);

fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
  .then(r=>r.json())
  .then(geo=>{
    L.geoJSON(geo,{style:{color:'#1a1208',weight:0.8,fillColor:'#f0e2c0',fillOpacity:0.9},interactive:false}).addTo(continentLayer);
    renderYear(currentYear);
  })
  .catch(err=>console.warn('Geo-Daten nicht geladen'));

const yearSlider = document.getElementById('year-slider');
const yearDisplay = document.getElementById('year-display');
const playBtn = document.getElementById('play-btn');
const legendItems = document.getElementById('legend-items');
const timelineEvents = document.getElementById('timeline-events');
const infoPanel = document.getElementById('info-panel');
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

let currentYear = 2025;
let playing = false;
let playInterval = null;

function showEmpireInfo(emp) {
  document.getElementById('info-name').textContent = emp.name;
  document.getElementById('info-period').textContent = `${emp.from}–${emp.to >= 2025 ? 'heute' : emp.to}`;
  document.getElementById('info-desc').textContent = emp.desc;
  let meta = '';
  if(emp.capName) meta+=`<div class="meta-row"><span class="meta-label">Hauptstadt</span>${emp.capName}</div>`;
  if(emp.ruler) meta+=`<div class="meta-row"><span class="meta-label">Herrscher</span>${emp.ruler}</div>`;
  if(emp.religion) meta+=`<div class="meta-row"><span class="meta-label">Religion</span>${emp.religion}</div>`;
  if(emp.pop) meta+=`<div class="meta-row"><span class="meta-label">Bevölkerung</span>${emp.pop}</div>`;
  if(emp.lang) meta+=`<div class="meta-row"><span class="meta-label">Sprache</span>${emp.lang}</div>`;
  document.getElementById('info-meta').innerHTML = meta;
  infoPanel.style.display = 'block';
}

function showEventInfo(ev) {
  document.getElementById('info-name').textContent = ev.name;
  document.getElementById('info-period').textContent = `Jahr ${ev.year}`;
  document.getElementById('info-desc').textContent = ev.desc;
  document.getElementById('info-meta').innerHTML = '';
  infoPanel.style.display = 'block';
}

function renderYear(year) {
  currentYear = year;
  yearDisplay.textContent = year;
  yearSlider.value = year;
  empireLayer.clearLayers();
  labelLayer.clearLayers();
  capitalLayer.clearLayers();
  eventLayer.clearLayers();

  const active = EMPIRES.filter(e=>year>=e.from && year<=e.to);

  active.forEach(e=>{
    const poly = L.polygon(e.poly,{color:'#1a1208',weight:0.8,fillColor:e.color,fillOpacity:0.55}).addTo(empireLayer);
    poly.on('click',()=>showEmpireInfo(e));
    poly.bindTooltip(e.name);
  });

  active.forEach(e=>{
    let cx=0,cy=0;
    e.poly.forEach(p=>{cx+=p[0];cy+=p[1];});
    cx/=e.poly.length;cy/=e.poly.length;
    const label=L.divIcon({className:'',html:`<div class="empire-label" style="font-size:${e.poly.length>8?12:10}px;">${e.name}</div>`,iconSize:[120,16],iconAnchor:[60,8]});
    L.marker([cx,cy],{icon:label,interactive:false}).addTo(labelLayer);
  });

  active.forEach(e=>{
    if(e.cap){
      const m=L.marker(e.cap,{icon:L.divIcon({className:'capital-marker',iconSize:[8,8]})}).addTo(capitalLayer);
      m.bindTooltip(`★ ${e.capName}`);
      m.on('click',()=>showEmpireInfo(e));
    }
  });

  const recentEvents=EVENTS.filter(ev=>Math.abs(ev.year-year)<=5);
  recentEvents.forEach(ev=>{
    const m=L.marker([ev.lat,ev.lng],{icon:L.divIcon({className:'event-marker',iconSize:[10,10]})}).addTo(eventLayer);
    m.bindTooltip(`⚡ ${ev.year}: ${ev.name}`);
    m.on('click',()=>showEventInfo(ev));
  });

  const seen=new Set();
  legendItems.innerHTML=active.filter(e=>{if(seen.has(e.name))return false;seen.add(e.name);return true;}).map(e=>`<div class="legend-item" data-id="${e.id}"><div class="legend-color" style="background:${e.color}"></div><div class="legend-label">${e.name}</div></div>`).join('');

  legendItems.querySelectorAll('.legend-item').forEach(item=>{
    item.addEventListener('click',()=>{
      const emp=active.find(x=>x.id===item.getAttribute('data-id'));
      if(emp){showEmpireInfo(emp);let cx=0,cy=0;emp.poly.forEach(p=>{cx+=p[0];cy+=p[1];});cx/=emp.poly.length;cy/=emp.poly.length;map.setView([cx,cy],4);}
    });
  });

  const upcoming=EVENTS.filter(ev=>ev.year>=year && ev.year<=year+25).slice(0,5);
  timelineEvents.innerHTML=upcoming.map(ev=>`<span class="tl-event" data-year="${ev.year}">${ev.year}: ${ev.name}</span>`).join('');
  timelineEvents.querySelectorAll('.tl-event').forEach(el=>{
    el.addEventListener('click',()=>{const y=parseInt(el.getAttribute('data-year'));yearSlider.value=y;renderYear(y);const ev=EVENTS.find(e=>e.year===y);if(ev){map.setView([ev.lat,ev.lng],4);showEventInfo(ev);}});
  });
}

yearSlider.addEventListener('input',()=>renderYear(parseInt(yearSlider.value)));

playBtn.addEventListener('click',()=>{
  if(playing){clearInterval(playInterval);playBtn.textContent='▶ Auto';playing=false;}
  else{playing=true;playBtn.textContent='⏸ Stop';playInterval=setInterval(()=>{let y=parseInt(yearSlider.value);y+=5;if(y>2025)y=1500;renderYear(y);},800);}
});

function doSearch(q) {
  q=q.toLowerCase().trim();
  if(q.length<2){searchResults.style.display='none';return;}
  const empResults=EMPIRES.filter(e=>e.name.toLowerCase().includes(q)||(e.capName&&e.capName.toLowerCase().includes(q))||(e.ruler&&e.ruler.toLowerCase().includes(q))).slice(0,6);
  const evResults=EVENTS.filter(e=>e.name.toLowerCase().includes(q)||e.desc.toLowerCase().includes(q)).slice(0,4);
  let html='';
  empResults.forEach(e=>{html+=`<div class="search-item" data-type="empire" data-id="${e.id}">${e.name}<span class="year">${e.from}–${e.to>=2025?'heute':e.to}</span></div>`;});
  evResults.forEach(e=>{html+=`<div class="search-item" data-type="event" data-year="${e.year}">${e.name}<span class="year">${e.year}</span></div>`;});
  if(!html) html='<div class="search-item">Keine Ergebnisse</div>';
  searchResults.innerHTML=html;
  searchResults.style.display='block';
  searchResults.querySelectorAll('.search-item').forEach(item=>{
    item.addEventListener('click',()=>{
      const type=item.getAttribute('data-type');
      if(type==='empire'){const emp=EMPIRES.find(x=>x.id===item.getAttribute('data-id'));if(emp){const midYear=Math.floor((emp.from+Math.min(emp.to,2025))/2);yearSlider.value=midYear;renderYear(midYear);let cx=0,cy=0;emp.poly.forEach(p=>{cx+=p[0];cy+=p[1];});cx/=emp.poly.length;cy/=emp.poly.length;map.setView([cx,cy],4);showEmpireInfo(emp);}}
      else if(type==='event'){const y=parseInt(item.getAttribute('data-year'));const ev=EVENTS.find(e=>e.year===y);if(ev){yearSlider.value=y;renderYear(y);map.setView([ev.lat,ev.lng],5);showEventInfo(ev);}}
      searchResults.style.display='none';
      searchInput.value='';
    });
  });
}

searchInput.addEventListener('input',()=>doSearch(searchInput.value));
searchInput.addEventListener('focus',()=>{if(searchInput.value)doSearch(searchInput.value);});
document.addEventListener('click',e=>{if(!e.target.closest('#search-box'))searchResults.style.display='none';});

document.getElementById('info-close').addEventListener('click',()=>infoPanel.style.display='none');

renderYear(2025);

})();
</script>

</body>
</html>
